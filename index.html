<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XOXO - Talk to Strangers</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* DEFINISI WARNA PANTONE (Approximation Hex) */
        :root {
            --pantone-218: #CE4E80;
            /* Vibrant Pink/Magenta */
            --pantone-256: #D1A7C6;
            /* Soft Lavender */
            --pantone-196: #F1C8C8;
            /* Soft Peach/Pink */
            --msg-you: #CE4E80;
            --msg-stranger: #4A4A4A;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--pantone-196);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header Styles */
        header {
            background-color: white;
            padding: 0.8rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            z-index: 50;
        }

        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--pantone-218);
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .online-count {
            font-size: 0.9rem;
            color: #666;
            font-weight: 500;
        }

        /* Start Screen */
        #start-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            background-color: var(--pantone-196);
        }

        .big-text {
            font-size: 2rem;
            font-weight: 700;
            color: #4a4a4a;
            margin-bottom: 2rem;
        }

        .mode-btn {
            background-color: var(--pantone-218);
            color: white;
            border: none;
            padding: 1rem 3rem;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin: 0.5rem;
            min-width: 200px;
        }

        .mode-btn:hover {
            transform: scale(1.02);
        }

        .mode-btn:active {
            transform: scale(0.98);
        }

        .mode-btn.secondary {
            background-color: #6b7280;
        }

        /* Chat Layout */
        #chat-interface {
            display: none;
            /* Hidden by default */
            flex: 1;
            flex-direction: column;
            height: 100%;
            background-color: white;
        }

        /* Layout untuk Video Mode (Split Screen) */
        .video-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Layout untuk Text Only Mode */
        .text-layout #video-area {
            display: none;
        }

        .text-layout #chat-log-area {
            width: 100%;
        }

        #video-area {
            flex: 1;
            background: black;
            position: relative;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ccc;
        }

        #chat-log-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: white;
            min-width: 320px;
        }

        #chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* Messages */
        .sys-msg {
            color: #888;
            font-weight: bold;
            font-size: 0.9rem;
            margin: 0.5rem 0;
        }

        .msg-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 4px;
        }

        .msg-label {
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 2px;
        }

        .msg-label.you {
            color: var(--pantone-218);
        }

        .msg-label.stranger {
            color: blue;
        }

        .msg-text {
            font-size: 1rem;
            color: #333;
            line-height: 1.4;
        }

        /* Control Bar (Omegle Style) */
        .control-bar {
            background-color: var(--pantone-256);
            /* Lavender */
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Tombol STOP / NEW */
        #btn-action {
            background-color: white;
            color: #333;
            font-weight: 700;
            border: 2px solid #999;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            min-width: 100px;
            text-transform: uppercase;
        }

        #btn-action.stop {
            color: red;
            border-color: red;
        }

        #btn-action.new {
            color: var(--pantone-218);
            border-color: var(--pantone-218);
        }

        .chat-input {
            flex: 1;
            padding: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
        }

        .chat-input:focus {
            border-color: var(--pantone-218);
        }

        .btn-send {
            background-color: var(--pantone-218);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Video Elements */
        #remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #local-video {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 120px;
            height: 90px;
            background: #333;
            border: 2px solid white;
            object-fit: cover;
            border-radius: 4px;
            transform: scaleX(-1);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .video-layout {
                flex-direction: column;
            }

            #video-area {
                height: 40vh;
                flex: none;
                border-right: none;
                border-bottom: 1px solid #ccc;
            }

            #chat-log-area {
                height: 60vh;
            }

            .mode-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">XOXO <span style="font-size:0.8em; color:#888; font-weight:400;">Talk to Strangers</span>
        </div>
        <div class="online-count"><span id="count-val">0</span>+ online</div>
    </header>

    <div id="start-screen">
        <div class="big-text">Start chatting:</div>
        <button class="mode-btn" onclick="enterMode('text')">Text only</button>
        <button class="mode-btn secondary" onclick="enterMode('video')">Video</button>

        <div class="mt-8 text-sm text-gray-500 max-w-md">
            Use XOXO to meet strangers. Video is monitored. Keep it clean.<br>
            <strong>18+ Only.</strong>
        </div>
    </div>

    <div id="chat-interface">
        <div id="main-layout" class="text-layout">
            <div id="video-area">
                <video id="remote-video" autoplay playsinline></video>
                <video id="local-video" autoplay playsinline muted></video>
                <div class="absolute top-2 left-2 bg-black/50 text-white px-2 py-1 text-xs rounded">Stranger</div>
                <div class="absolute bottom-24 right-2 bg-black/50 text-white px-2 py-1 text-xs rounded">You</div>
            </div>

            <div id="chat-log-area">
                <div id="chat-log">
                    <div class="sys-msg">Welcome to XOXO! Click 'Start' to find a stranger.</div>
                </div>

                <div class="control-bar">
                    <button id="btn-action" class="new" onclick="handleActionBtn()">Start</button>

                    <input type="text" id="msg-input" class="chat-input" placeholder="Type your message..." disabled>
                    <button class="btn-send" onclick="sendMessage()" id="btn-send" disabled>Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Variables ---
        let conn;
        let isConnected = false;
        let isSearching = false;
        let mode = 'text'; // 'text' or 'video'
        let chatState = 'idle'; // 'idle', 'searching', 'chatting'

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const chatInterface = document.getElementById('chat-interface');
        const mainLayout = document.getElementById('main-layout');
        const chatLog = document.getElementById('chat-log');
        const msgInput = document.getElementById('msg-input');
        const btnAction = document.getElementById('btn-action');
        const btnSend = document.getElementById('btn-send');
        const countVal = document.getElementById('count-val');

        // WebRTC
        let localStream;
        let peerConnection;
        const localVideo = document.getElementById('local-video');
        const remoteVideo = document.getElementById('remote-video');
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // --- Core Functions ---

        function enterMode(selectedMode) {
            mode = selectedMode;
            startScreen.style.display = 'none';
            chatInterface.style.display = 'flex';

            if (mode === 'video') {
                mainLayout.className = 'video-layout';
                initCamera();
            } else {
                mainLayout.className = 'text-layout';
            }

            initSocket();
        }

        async function initCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
            } catch (e) {
                alert("Camera access denied or missing.");
                enterMode('text'); // Fallback
            }
        }

        function initSocket() {
            conn = new WebSocket('wss://chat.1year.site/ws'); // Ganti URL WebSocket Anda

            conn.onopen = () => {
                console.log("Connected to Server");
                // Auto start searching immediately like Omegle
                handleActionBtn();
            };

            conn.onclose = () => {
                logSystem("Connection lost. Reconnecting...");
                setTimeout(initSocket, 3000);
            };

            conn.onmessage = (e) => {
                const data = JSON.parse(e.data);

                if (data.status === 'stats') {
                    countVal.innerText = data.count;
                }
                else if (data.status === 'waiting') {
                    chatState = 'searching';
                    updateUIState();
                    logSystem("Looking for someone you can chat with...");
                }
                else if (data.status === 'connected') {
                    chatState = 'chatting';
                    isConnected = true;
                    updateUIState();
                    logSystem("You're now chatting with a random stranger. Say hi!");

                    if (mode === 'video') startCall(); // Auto call logic
                }
                else if (data.status === 'disconnected') {
                    chatState = 'idle';
                    isConnected = false;
                    endCall();
                    updateUIState();
                    logSystem("Stranger has disconnected.");
                }
                else if (data.status === 'message') {
                    appendMessage("Stranger", data.msg, 'stranger');
                }
                else if (data.status === 'call_signal') {
                    handleSignal(data.signal);
                }
                else if (data.status === 'typing') {
                    // Optional: Show "Stranger is typing..."
                }
            };
        }

        // --- Action Button Logic (Stop / New) ---
        function handleActionBtn() {
            if (chatState === 'idle') {
                // Logic: Start New
                chatLog.innerHTML = ''; // Clear chat
                conn.send(JSON.stringify({ action: 'find_partner' }));
            } else if (chatState === 'searching') {
                // Logic: Cancel Search (not implemented in server but UI can show idle)
                // For simplified Omegle logic, we treat "Stop" as "Next" if not connected
                // But server handles 'next' by cleaning up and finding new.
                // Let's make button act as disconnect/new toggle.
                // Actually server 'next' command works for both waiting and connected states to cycle.
                // To truly "Stop" (Idle), we need a disconnect action.

                // For simplicity: Button cycles "New" -> "Stop" (Disconnect) -> "New"
                // But user wants ease. Omegle button usually is "Stop" -> "Really?" -> "New".

                // Let's implement: Click -> Next
                conn.send(JSON.stringify({ action: 'next' }));
            } else if (chatState === 'chatting') {
                // Logic: Disconnect
                conn.send(JSON.stringify({ action: 'disconnect' }));
                // Note: Server needs 'disconnect' action or we use 'next' to immediately skip.
                // Let's use 'disconnect' logic which I added to Chat.php or reuse 'next'
                // Reusing 'next' immediately finds a new one. 
                // To implement true "Stop" we just send 'next' to clear current, then wait.

                // Let's strictly follow Omegle: Button is "Stop" (Disconnects) -> becomes "New"
                conn.send(JSON.stringify({ action: 'disconnect' }));
                chatState = 'idle';
                isConnected = false;
                endCall();
                updateUIState();
                logSystem("You have disconnected.");
            }
        }

        function updateUIState() {
            // Enable/Disable inputs
            if (chatState === 'chatting') {
                msgInput.disabled = false;
                btnSend.disabled = false;
                msgInput.focus();

                btnAction.innerText = "Stop";
                btnAction.className = "stop"; // Red color
            } else if (chatState === 'searching') {
                msgInput.disabled = true;
                btnSend.disabled = true;

                btnAction.innerText = "Stop"; // Can cancel search
                btnAction.className = "stop";
            } else { // Idle
                msgInput.disabled = true;
                btnSend.disabled = true;

                btnAction.innerText = "New Chat";
                btnAction.className = "new"; // Pink color
            }
        }

        // --- Chat Functions ---
        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text || !isConnected) return;

            appendMessage("You", text, 'you');
            conn.send(JSON.stringify({ action: 'message', content: text }));
            msgInput.value = '';
        }

        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function appendMessage(name, text, type) {
            const div = document.createElement('div');
            div.className = 'msg-row';
            div.innerHTML = `
                <span class="msg-label ${type}">${name}:</span>
                <span class="msg-text">${text}</span>
            `;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function logSystem(text) {
            const div = document.createElement('div');
            div.className = 'sys-msg';
            div.innerText = text;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        // --- WebRTC Logic ---
        async function startCall() {
            if (peerConnection) peerConnection.close();
            peerConnection = new RTCPeerConnection(rtcConfig);

            // Add Tracks
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            // Handle Remote Stream
            peerConnection.ontrack = (e) => {
                remoteVideo.srcObject = e.streams[0];
            };

            // ICE Candidates
            peerConnection.onicecandidate = (e) => {
                if (e.candidate) conn.send(JSON.stringify({ action: 'call_signal', data: { type: 'candidate', candidate: e.candidate } }));
            };

            // Create Offer
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            conn.send(JSON.stringify({ action: 'call_signal', data: { type: 'offer', sdp: offer } }));
        }

        async function handleSignal(signal) {
            if (!peerConnection) {
                // Initialize if answering
                peerConnection = new RTCPeerConnection(rtcConfig);
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
                peerConnection.ontrack = (e) => remoteVideo.srcObject = e.streams[0];
                peerConnection.onicecandidate = (e) => {
                    if (e.candidate) conn.send(JSON.stringify({ action: 'call_signal', data: { type: 'candidate', candidate: e.candidate } }));
                };
            }

            if (signal.type === 'offer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.sdp));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                conn.send(JSON.stringify({ action: 'call_signal', data: { type: 'answer', sdp: answer } }));
            }
            else if (signal.type === 'answer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.sdp));
            }
            else if (signal.type === 'candidate') {
                await peerConnection.addIceCandidate(new RTCIceCandidate(signal.candidate));
            }
        }

        function endCall() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            remoteVideo.srcObject = null;
        }

    </script>
</body>

</html>
