<!DOCTYPE html>
<html lang="en" data-theme="night">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XOXO - Video Chat</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            height: 100dvh;
            overflow: hidden;
            background-image: radial-gradient(circle at top right, #1d232a 0%, #0f172a 100%);
        }

        .chat-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg-anim {
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Video Container Styling */
        #video-container {
            transition: all 0.3s ease;
        }

        video {
            object-fit: cover;
            transform: scaleX(-1);
            /* Mirror effect */
        }
    </style>
</head>

<body class="text-base-content h-[100dvh] flex flex-col overflow-hidden">

    <dialog id="disclaimer_modal" class="modal modal-open backdrop-blur-md">
        <div class="modal-box bg-base-100/90 border border-white/10 shadow-2xl">
            <h3 class="font-bold text-3xl text-primary mb-2">Welcome to XOXO</h3>
            <div class="bg-base-200/50 p-4 rounded-xl text-sm space-y-2 border border-white/5">
                <div class="flex items-center gap-2"><span class="text-error">🔞</span> 18+ Only.</div>
                <div class="flex items-center gap-2">📹 Video & Audio enabled.</div>
                <div class="flex items-center gap-2">🛡️ P2P Encryption.</div>
            </div>
            <div class="modal-action">
                <button class="btn btn-primary px-8" onclick="handleAgree()">Start</button>
            </div>
        </div>
    </dialog>

    <div id="incoming_call_overlay"
        class="fixed inset-0 z-[60] bg-black/90 backdrop-blur-xl flex flex-col items-center justify-center hidden">
        <div class="avatar placeholder mb-6">
            <div class="bg-neutral text-neutral-content rounded-full w-24 animate-bounce"><span
                    class="text-3xl">📹</span></div>
        </div>
        <h2 class="text-2xl font-bold text-white mb-8">Incoming Video Call...</h2>
        <div class="flex gap-8 items-center">
            <button onclick="rejectCall()" class="btn btn-circle btn-error btn-lg">✖</button>
            <button onclick="acceptCall()"
                class="btn btn-circle btn-success btn-lg shadow-[0_0_30px_rgba(34,197,94,0.6)]">✔</button>
        </div>
    </div>

    <div class="drawer lg:drawer-open h-full">
        <input id="my-drawer-2" type="checkbox" class="drawer-toggle" />

        <div class="drawer-content flex flex-col h-[100dvh]">
            <div class="navbar bg-base-100/80 backdrop-blur-md border-b border-base-content/5 lg:hidden min-h-[60px]">
                <div class="flex-none">
                    <label for="my-drawer-2" class="btn btn-square btn-ghost">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            class="inline-block w-6 h-6 stroke-current">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </label>
                </div>
                <div class="flex-1"><a class="btn btn-ghost normal-case text-xl font-bold">XOXO</a></div>
                <div class="flex-none">
                    <div class="badge badge-success badge-sm animate-pulse mr-2"><span id="mobile-count">0</span></div>
                </div>
            </div>

            <div class="flex-grow flex flex-col relative overflow-hidden bg-base-300/30">

                <div
                    class="absolute top-0 w-full z-10 bg-gradient-to-b from-base-300 to-transparent p-4 pointer-events-none">
                    <div class="flex justify-between items-start pointer-events-auto">
                        <div>
                            <h2 id="chat-title" class="text-2xl font-black tracking-tight text-white/90 drop-shadow-md">
                                Random Chat</h2>
                            <div class="flex items-center gap-2 mt-1">
                                <span id="status-dot" class="w-2 h-2 rounded-full bg-warning"></span>
                                <span id="status-bar" class="text-xs font-medium opacity-70">Initializing...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="video-container" class="absolute top-20 right-4 z-40 hidden flex-col gap-2 items-end">
                    <div
                        class="relative w-40 h-52 bg-black rounded-xl overflow-hidden shadow-2xl border border-white/20">
                        <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
                        <div class="absolute bottom-1 left-2 text-[10px] bg-black/50 px-2 rounded text-white">Stranger
                        </div>
                    </div>
                    <div
                        class="w-20 h-28 bg-black rounded-lg overflow-hidden shadow-lg border border-white/20 -mt-10 mr-2 z-50">
                        <video id="local-video" autoplay playsinline muted class="w-full h-full object-cover"></video>
                    </div>
                </div>

                <div id="random-chat-view" class="flex flex-col h-full pt-20">
                    <div id="random-chat-box" class="flex-grow chat-scroll overflow-y-auto p-4 space-y-4 pb-4">
                        <div class="flex flex-col items-center justify-center h-full opacity-30 gap-2">
                            <span class="text-4xl">🕵️</span>
                            <span class="text-sm">Find a stranger to start</span>
                        </div>
                    </div>

                    <div id="typing-indicator"
                        class="h-6 px-6 text-xs font-semibold text-primary/70 opacity-0 transition-opacity duration-300 flex items-center gap-1">
                        <span class="loading loading-dots loading-xs"></span> Stranger is typing...
                    </div>

                    <div class="p-3 bg-base-100/80 backdrop-blur-lg border-t border-white/5 pb-6 lg:pb-3">
                        <div id="controls" class="w-full mb-3">
                            <button id="btn-start" onclick="startRandomChat()"
                                class="btn btn-primary w-full shadow-lg shadow-primary/20 bg-gradient-to-r from-primary to-secondary text-white font-bold">
                                Find Stranger
                            </button>
                            <button id="btn-next" onclick="nextPartner()"
                                class="btn btn-error w-full hidden shadow-lg text-white">
                                Next Stranger (Esc)
                            </button>
                        </div>

                        <div id="random-input-area" class="flex gap-2 hidden transition-all duration-300">
                            <button id="btn-call" onclick="startCall()"
                                class="btn btn-circle btn-ghost text-info hover:bg-info/10">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                </svg>
                            </button>
                            <button id="btn-hangup" onclick="endCall()"
                                class="btn btn-circle btn-error text-white hidden">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>

                            <div class="relative flex-grow">
                                <input type="text" id="random-msg-input"
                                    class="input input-bordered w-full rounded-full pl-4 pr-10 bg-base-200/50"
                                    placeholder="Type a message..." onkeypress="handleInput(event, 'random')"
                                    onkeyup="sendTypingSignal()" autocomplete="off">
                            </div>
                            <button onclick="sendMessage('random')" class="btn btn-circle btn-primary">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform rotate-90"
                                    viewBox="0 0 20 20" fill="currentColor">
                                    <path
                                        d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div id="public-chat-view" class="flex flex-col h-full pt-20 hidden">
                    <div id="public-chat-box" class="flex-grow chat-scroll overflow-y-auto p-4 space-y-4 pb-4">
                        <div class="divider opacity-50 text-xs">Public Lounge</div>
                    </div>
                    <div class="p-3 bg-base-100/80 backdrop-blur-lg border-t border-white/5 pb-6 lg:pb-3">
                        <div class="flex gap-2">
                            <input type="text" id="public-msg-input"
                                class="input input-bordered w-full rounded-full bg-base-200/50"
                                placeholder="Message everyone..." onkeypress="handleInput(event, 'public')"
                                autocomplete="off">
                            <button onclick="sendMessage('public')" class="btn btn-circle btn-secondary">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform rotate-90"
                                    viewBox="0 0 20 20" fill="currentColor">
                                    <path
                                        d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <div class="drawer-side z-50">
            <label for="my-drawer-2" aria-label="close sidebar" class="drawer-overlay"></label>
            <ul
                class="menu p-4 w-80 min-h-full bg-base-100/95 backdrop-blur-xl text-base-content border-r border-white/5">
                <div class="mb-8 px-2 flex justify-between items-center">
                    <div>
                        <h1
                            class="text-3xl font-black bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">
                            XOXO</h1>
                        <p class="text-xs opacity-50 font-mono tracking-widest">VIDEO CHAT</p>
                    </div>
                    <div class="badge badge-outline text-xs"><span id="count-val">0</span> Online</div>
                </div>
                <div class="space-y-2">
                    <li><a onclick="switchMode('random')" id="nav-random" class="active font-bold">Random Chat</a></li>
                    <li><a onclick="switchMode('public')" id="nav-public" class="font-bold">Public Lounge</a></li>
                </div>
                <div class="mt-auto pt-6 border-t border-white/5">
                    <p class="font-bold truncate text-primary px-4" id="sidebar-nickname">...</p>
                </div>
            </ul>
        </div>
    </div>

    <script>
        // --- VARIABLES ---
        let conn;
        let currentMode = 'random';
        let myNickname = '';

        // UI Elements
        const randomView = document.getElementById('random-chat-view');
        const publicView = document.getElementById('public-chat-view');
        const randomBox = document.getElementById('random-chat-box');
        const publicBox = document.getElementById('public-chat-box');
        const chatTitle = document.getElementById('chat-title');
        const countVal = document.getElementById('count-val');
        const mobileCount = document.getElementById('mobile-count');
        const statusDot = document.getElementById('status-dot');
        const statusBar = document.getElementById('status-bar');

        const btnStart = document.getElementById('btn-start');
        const btnNext = document.getElementById('btn-next');
        const randomInputArea = document.getElementById('random-input-area');
        const randomInput = document.getElementById('random-msg-input');
        const publicInput = document.getElementById('public-msg-input');

        // Video Elements
        let localStream;
        let peerConnection;
        const localVideo = document.getElementById('local-video');
        const remoteVideo = document.getElementById('remote-video');
        const videoContainer = document.getElementById('video-container');
        const btnCall = document.getElementById('btn-call');
        const btnHangup = document.getElementById('btn-hangup');
        const incomingOverlay = document.getElementById('incoming_call_overlay');

        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function handleAgree() {
            document.getElementById('disclaimer_modal').classList.remove('modal-open');
            initSocket();
        }

        // --- WEBSOCKET ---
        function initSocket() {
            // NOTE: CHANGE TO YOUR DOMAIN/IP
            conn = new WebSocket('ws://localhost:8080');

            conn.onopen = function () {
                updateStatus("Connected", "success");
                conn.send(JSON.stringify({ action: 'join_room', room: 'random' }));
            };

            conn.onclose = function () {
                updateStatus("Disconnected", "error");
                setRandomUI('disconnected');
                endCall(true);
                setTimeout(initSocket, 3000);
            };

            conn.onmessage = function (e) {
                const data = JSON.parse(e.data);

                if (data.status === 'identity') {
                    myNickname = data.nickname;
                    document.getElementById('sidebar-nickname').innerText = myNickname;
                }
                else if (data.status === 'stats') {
                    // Update Online Counter
                    countVal.innerText = data.count;
                    mobileCount.innerText = data.count;
                }
                else if (data.status === 'system') {
                    logSystem(randomBox, data.msg); // For Anti-Spam warnings
                }
                else if (data.status === 'waiting') {
                    setRandomUI('waiting');
                    logSystem(randomBox, data.msg);
                }
                else if (data.status === 'connected') {
                    setRandomUI('connected');
                    logSystem(randomBox, "You are connected with a Stranger.");
                }
                else if (data.status === 'disconnected') {
                    setRandomUI('disconnected_partner');
                    logSystem(randomBox, "Stranger left.");
                    endCall(true);
                }
                else if (data.status === 'message') {
                    showTyping(false);
                    logMessage(randomBox, 'stranger', 'Stranger', data.msg);
                }
                else if (data.status === 'public_msg') {
                    logMessage(publicBox, 'other', data.name, data.msg);
                }
                else if (data.status === 'typing') showTyping(true);

                // Video Signaling
                else if (data.status === 'call_signal') handleSignalMessage(data.signal);
            };
        }

        // --- UI LOGIC ---
        function updateStatus(text, type) {
            statusBar.innerText = text;
            statusDot.className = `w-2 h-2 rounded-full ${type === 'success' ? 'bg-success' : type === 'warning' ? 'bg-warning' : 'bg-error'}`;
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('my-drawer-2').checked = false; // Close drawer
            document.getElementById('nav-random').classList.toggle('active', mode === 'random');
            document.getElementById('nav-public').classList.toggle('active', mode === 'public');

            randomView.classList.toggle('hidden', mode !== 'random');
            publicView.classList.toggle('hidden', mode !== 'public');
            chatTitle.innerText = mode === 'random' ? "Random Chat" : "Public Lounge";
        }

        function setRandomUI(state) {
            btnNext.classList.add('hidden');
            randomInputArea.classList.add('hidden');
            btnStart.classList.add('hidden');
            randomInputArea.classList.remove('flex');

            if (state === 'waiting') {
                updateStatus("Searching...", "warning");
            } else if (state === 'connected') {
                btnNext.classList.remove('hidden');
                randomInputArea.classList.remove('hidden');
                randomInputArea.classList.add('flex');
                updateStatus("Online", "success");
            } else if (state === 'disconnected' || state === 'disconnected_partner') {
                btnNext.classList.remove('hidden');
                updateStatus(state === 'disconnected' ? "Disconnected" : "Partner Left", "error");
            }
        }

        function logMessage(container, type, name, msg) {
            const isMe = type === 'you';
            const align = isMe ? 'chat-end' : 'chat-start';
            const bubbleColor = isMe ? 'bg-primary text-primary-content' : 'bg-base-200 text-base-content';

            container.innerHTML += `
            <div class="chat ${align} msg-anim">
                <div class="chat-header text-xs opacity-50 mb-1 ml-1">${name}</div>
                <div class="chat-bubble ${bubbleColor} shadow-md text-sm break-words">${msg}</div>
            </div>`;
            container.scrollTop = container.scrollHeight;
        }

        function logSystem(container, msg) {
            container.innerHTML += `<div class="flex justify-center my-2 opacity-60 text-xs"><span>${msg}</span></div>`;
            container.scrollTop = container.scrollHeight;
        }

        // --- ACTIONS ---
        function startRandomChat() {
            if (conn.readyState === WebSocket.OPEN) {
                conn.send(JSON.stringify({ action: 'find_partner' }));
                btnStart.classList.add('hidden');
            }
        }

        function nextPartner() {
            randomBox.innerHTML = '';
            endCall();
            conn.send(JSON.stringify({ action: 'next' }));
        }

        function sendMessage(context) {
            const input = context === 'random' ? randomInput : publicInput;
            const text = input.value.trim();
            if (!text) return;

            logMessage(context === 'random' ? randomBox : publicBox, 'you', 'You', text);
            conn.send(JSON.stringify({ action: 'message', content: text, context: context }));
            input.value = '';
        }

        function handleInput(e, ctx) { if (e.key === 'Enter') sendMessage(ctx); }

        let typingTimer;
        function sendTypingSignal() {
            if (conn.readyState === WebSocket.OPEN) conn.send(JSON.stringify({ action: 'typing' }));
        }
        function showTyping(show) {
            const ind = document.getElementById('typing-indicator');
            ind.style.opacity = show ? '1' : '0';
            clearTimeout(typingTimer);
            if (show) typingTimer = setTimeout(() => ind.style.opacity = '0', 3000);
        }

        // --- VIDEO CALL LOGIC ---
        async function startCall() {
            btnCall.classList.add('hidden');
            btnHangup.classList.remove('hidden');

            try {
                // Request VIDEO and Audio
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                videoContainer.classList.remove('hidden');
                videoContainer.classList.add('flex');

                createPeerConnection();
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                conn.send(JSON.stringify({ action: 'call_signal', data: { type: 'offer', sdp: offer } }));
                logSystem(randomBox, "📹 Calling stranger...");
            } catch (err) {
                alert("Camera/Mic permission denied!");
                endCall();
            }
        }

        async function handleSignalMessage(signal) {
            if (!peerConnection) createPeerConnection();

            if (signal.type === 'offer') {
                incomingOverlay.classList.remove('hidden');
                window.pendingOffer = signal.sdp;
            } else if (signal.type === 'answer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.sdp));
            } else if (signal.type === 'candidate' && signal.candidate) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(signal.candidate));
            } else if (signal.type === 'hangup') {
                endCall(true);
                logSystem(randomBox, "📹 Call ended.");
            }
        }

        async function acceptCall() {
            incomingOverlay.classList.add('hidden');
            btnCall.classList.add('hidden');
            btnHangup.classList.remove('hidden');

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                videoContainer.classList.remove('hidden');
                videoContainer.classList.add('flex');

                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
                await peerConnection.setRemoteDescription(new RTCSessionDescription(window.pendingOffer));

                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                conn.send(JSON.stringify({ action: 'call_signal', data: { type: 'answer', sdp: answer } }));
            } catch (e) { endCall(); }
        }

        function rejectCall() {
            incomingOverlay.classList.add('hidden');
            conn.send(JSON.stringify({ action: 'call_signal', data: { type: 'hangup' } }));
        }

        function createPeerConnection() {
            if (peerConnection) return;
            peerConnection = new RTCPeerConnection(rtcConfig);
            peerConnection.onicecandidate = (e) => {
                if (e.candidate) conn.send(JSON.stringify({ action: 'call_signal', data: { type: 'candidate', candidate: e.candidate } }));
            };
            peerConnection.ontrack = (e) => {
                remoteVideo.srcObject = e.streams[0];
            };
        }

        function endCall(isRemote = false) {
            if (!isRemote && conn && conn.readyState === WebSocket.OPEN) {
                conn.send(JSON.stringify({ action: 'call_signal', data: { type: 'hangup' } }));
            }
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }

            localVideo.srcObject = null;
            remoteVideo.srcObject = null;
            videoContainer.classList.add('hidden');
            videoContainer.classList.remove('flex');
            btnCall.classList.remove('hidden');
            btnHangup.classList.add('hidden');
            incomingOverlay.classList.add('hidden');
        }
    </script>
</body>

</html>
