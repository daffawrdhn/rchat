<!DOCTYPE html>
<html lang="en" data-theme="night">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XOXO - 1Year.site</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-image: radial-gradient(circle at top right, #1d232a 0%, #0f172a 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Floating Animation */
        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-15px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .anim-float {
            animation: float 4s ease-in-out infinite;
        }

        /* Slide Up Animation */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .anim-slide {
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Glow Effect behind title */
        .glow-bg {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(116, 128, 255, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>

<body class="flex flex-col">

    <div class="navbar bg-transparent absolute top-0 z-50 px-6 py-4">
        <div class="flex-1">
            <a class="text-2xl font-black tracking-tighter text-white">XOXO<span class="text-primary">.</span></a>
        </div>
        <div class="flex-none">
            <a href="https://github.com/daffawrdhn/rchat" target="_blank"
                class="btn btn-ghost btn-sm text-xs opacity-60">GitHub</a>
        </div>
    </div>

    <div class="hero min-h-screen relative">
        <div class="glow-bg"></div>

        <div class="hero-content text-center flex-col z-10">

            <div class="mb-6 relative anim-float">
                <div
                    class="w-24 h-24 rounded-3xl bg-gradient-to-tr from-primary to-secondary flex items-center justify-center shadow-[0_0_30px_rgba(116,128,255,0.4)]">
                    <span class="text-6xl">👻</span>
                </div>
                <div class="absolute -top-2 -right-2 w-4 h-4 rounded-full bg-error animate-pulse"></div>
            </div>

            <div class="max-w-md anim-slide" style="animation-delay: 0.1s;">
                <h1 class="text-5xl md:text-7xl font-black mb-4 tracking-tight leading-tight">
                    Talk to <br>
                    <span
                        class="bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">Strangers.</span>
                </h1>
                <p class="py-6 opacity-70 text-lg font-light">
                    Anonymous text and video chat. No login required.
                    <br>Meet someone new in one click.
                </p>

                <div class="flex flex-col gap-3 items-center">
                    <a href="https://chat.1year.site"
                        class="btn btn-primary btn-lg rounded-full px-10 shadow-[0_0_20px_rgba(116,128,255,0.3)] hover:shadow-[0_0_30px_rgba(116,128,255,0.5)] border-none transition-all hover:scale-105">
                        Start Chatting Now 🚀
                    </a>
                    <span class="text-[10px] uppercase tracking-widest opacity-40 mt-2">18+ Only • Terms Apply</span>
                </div>
            </div>

        </div>

        <div class="absolute top-1/4 left-10 opacity-20 text-4xl animate-bounce" style="animation-duration: 3s;">💬
        </div>
        <div class="absolute bottom-1/4 right-10 opacity-20 text-4xl animate-bounce" style="animation-duration: 4s;">📹
        </div>
        <div class="absolute bottom-10 left-1/3 opacity-10 text-2xl animate-pulse">👋</div>
    </div>

    <footer class="footer items-center p-4 bg-base-300/30 text-base-content backdrop-blur-sm border-t border-white/5">
        <aside class="items-center grid-flow-col">
            <p class="text-xs opacity-50">Copyright © 2024 - 1Year.site</p>
        </aside>
        <nav class="grid-flow-col gap-4 md:place-self-center md:justify-self-end">
            <div class="badge badge-outline text-xs opacity-50">v2.0 Beta</div>
        </nav>
    </footer>

</body>

</html>
